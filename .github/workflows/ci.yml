name: CI

# Validates the package and the shell before anything is tagged. Consumers pin a tag (RELEASING.md), and nothing builds at
# install, so a commit whose dist/ is stale or whose tests fail must not reach main.

on:
  push:
    branches: [main]
  # Any base: a stacked PR (WEB-3 on WEB-2) is validated too.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn tsc

      - name: Test
        run: yarn test --ci
        env:
          CI: "true"

      - name: Build the package
        run: yarn build

      - name: Committed dist matches a fresh build
        run: yarn check-dist

      - name: Build the shell
        run: yarn app:build

      - name: Pack the shell (CSP and hashed-asset checks)
        run: yarn app:bundle
